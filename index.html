document.addEventListener("click",e=>{
  const t=e.target;
  const exi=t.closest("[data-idea]");if(exi){const i=$("#homeIdea");if(i){i.value=exi.dataset.idea;i.focus();i.setSelectionRange(i.value.length,i.value.length)}return}
  const close=t.closest("[data-close]");if(close){closeLayer();S._confirmTask=null;return}
  const v=t.closest("[data-view]");if(v){e.preventDefault();go(v.dataset.view);return}
  const g=t.closest("[data-go]");if(g){e.preventDefault();if(g.dataset.go==="docs")S.ui.doc="status";go(g.dataset.go);return}
  const a=t.closest("[data-act]");if(a){e.preventDefault();act(a.dataset.act,a);return}
  const tk=t.closest("[data-task]");if(tk&&!t.closest(".drawer")){openTask(tk.dataset.task);return}
  const ph=t.closest("[data-ph]");if(ph){S.ui.collapsed[ph.dataset.ph]=!S.ui.collapsed[ph.dataset.ph];render();return}
  const z=t.closest("[data-zoom]");if(z){S.ui.zoom=z.dataset.zoom;S._resetScroll=true;render();return}
  const cell=t.closest("[data-cell]");if(cell){S.ui.riskCell=S.ui.riskCell===cell.dataset.cell?null:cell.dataset.cell;render();return}
  const dc=t.closest("[data-doc]");if(dc){S.ui.doc=dc.dataset.doc;render();return}
  const sg=t.closest("[data-sugg]");if(sg){sendChat(sg.dataset.sugg);return}
  const op=t.closest("[data-open]");if(op){S.cur=op.dataset.open;S.undo=[];S.redo=[];persist();go("overview");return}
  const dp=t.closest("[data-dup]");if(dp){const src=S.projects.find(x=>x.id===dp.dataset.dup);const cp=JSON.parse(JSON.stringify(src));cp.id="p-"+uid();cp.name=src.name+" (copy)";cp.sample=false;cp.updatedAt=Date.now();S.projects.push(cp);persist(cp);render();toast("Duplicated");return}
  const ad=t.closest("[data-askdel]");if(ad){S._confirmDel=ad.dataset.askdel;render();return}
  const dl=t.closest("[data-del]");if(dl){const id=dl.dataset.del;S.projects=S.projects.filter(x=>x.id!==id);removeRemote(id);S._confirmDel=null;if(S.cur===id){S.cur=S.projects[0]?.id||null;S.undo=[];S.redo=[]}persist();render();toast("Project deleted");return}
});
document.addEventListener("change",e=>{
  const t=e.target,p=P();
  if(t.id==="projSel"){if(t.value==="__new"){t.value=S.cur;openNew();return}if(t.value==="__all"){t.value=S.cur;go("projects");return}S.cur=t.value;S.undo=[];S.redo=[];S.ui.scenario=[];S.ui.scenarioOut=null;persist();render();return}
  if(t.id==="gowner"||t.id==="bowner"){S.ui.owner=t.value;render();return}
  if(t.id==="gcrit"){S.ui.critOnly=t.checked;render();return}
  if(t.id==="gbase"){S.ui.showBase=t.checked;render();return}
  if(t.id==="mcN"){S.ui.mcN=+t.value;return}
  if(t.dataset.mem){const id=t.dataset.mem,f=t.dataset.f;return commit("Updated team member",p=>{const m=p.team.find(x=>x.id===id);m[f]=(f==="rate"||f==="capacity")?Math.max(0,+t.value||0):t.value},{noToast:true})}
  if(t.dataset.line){return commit(`Updated ${CATS[t.dataset.line]} budget`,p=>p.lines[t.dataset.line]=Math.max(0,+t.value||0),{noToast:true})}
  if(t.id==="bud")return commit("Changed approved budget",p=>p.budget=Math.max(0,+t.value||0));
  if(t.id==="cont")return commit("Changed contingency",p=>p.contPct=clamp(+t.value||0,0,50));
  if(t.dataset.risk){const id=t.dataset.risk,f=t.dataset.f;return commit("Updated risk",p=>{const r=p.risks.find(x=>x.id===id);r[f]=(f==="p"||f==="i")?+t.value:t.value},{noToast:true})}
  if(t.dataset.ch!=null){const ch=S.ui.scenario[+t.dataset.ch];ch[t.dataset.f]=t.type==="number"?+t.value:t.value;S.ui.scenarioOut=null;return}
});
let qT;document.addEventListener("input",e=>{if(e.target.id==="gq"){clearTimeout(qT);qT=setTimeout(()=>{S.ui.q=e.target.value;render();const i=$("#gq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},180)}});
document.addEventListener("submit",e=>{if(e.target.id==="exForm"){e.preventDefault();const d=$("#exDesc").value.trim(),a=+$("#exAmt").value;if(!d||!(a>0)){toast("Add a description and an amount.");return}
  commit(`Recorded expense: ${d}`,p=>p.expenses.push({id:uid(),date:$("#exDate").value||todayIso(),desc:d,cat:$("#exCat").value,status:$("#exSt").value,amount:a}))}});
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey,tag=(e.target.tagName||"").toLowerCase(),typing=["input","textarea","select"].includes(tag);
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return}
  if(e.key==="Escape"&&$("#layer").innerHTML){closeLayer();return}
  if(e.target.id==="homeIdea"&&e.key==="Enter"&&mod){e.preventDefault();act("homeGo");return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if(!mod&&!e.altKey&&/^[1-8]$/.test(e.key)&&!$("#layer").innerHTML){go(VIEWS[+e.key-1][0]);return}
  if(e.key==="Enter"&&e.target.dataset?.task){openTask(e.target.dataset.task)}
});
$("#undoBtn").addEventListener("click",undo);$("#redoBtn").addEventListener("click",redo);
$("#palBtn").addEventListener("click",openPalette);$("#askBtn").addEventListener("click",openAssistant);
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||!Array.isArray(p.tasks)||!Array.isArray(p.team)||!p.start)throw 0;
    p.id="p-"+uid();p.sample=false;p.updatedAt=Date.now();for(const k of["phases","risks","expenses","history","log"])p[k]=Array.isArray(p[k])?p[k]:[];p.lines=p.lines||{};p.docs=p.docs||{};p.contPct=p.contPct??10;p.currency=p.currency||"EUR";p.target=p.target||iso(addDays(D(p.start),90));
    if(!p.baseline)setBaseline(p);S.projects.push(p);S.cur=p.id;persist(p);go("overview");toast("Imported "+p.name)}
  catch{toast("That file isn't a Pathwise project backup.")}});
window.addEventListener("resize",()=>{clearTimeout(S._rz);S._rz=setTimeout(()=>{if(S.view==="schedule")render()},200)});

/* daily snapshot for the S-curve */
function snapshot(){const p=P();if(!p||p.sample)return;const c=calc(p);if(c.today<=0)return;const last=p.history[p.history.length-1];
  if(last&&last.wd===c.today)return;p.history.push({wd:c.today,ev:Math.round(c.EV),ac:Math.round(c.AC),rem:Math.round(burndown(p,c).remNow)});p.history=p.history.filter(h=>h.wd<=c.today).slice(-400);persist(p)}

/* boot */
loadLocal();
{const h=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h)||h==="projects"||h==="home")S.view=h;if(h==="new")setTimeout(openNew,50)}
snapshot();render();initCaps();
</script>
