<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pathwise turns a project idea into a scheduled plan with critical path, finish-date forecasts, earned value, risks, what-if scenarios and downloadable Word, PDF and Excel documents.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='3' width='11' height='4' rx='1.5' fill='%232E47CF'/%3E%3Crect x='6' y='9' width='13' height='4' rx='1.5' fill='%23141A17'/%3E%3Crect x='10' y='15' width='8' height='4' rx='1.5' fill='%23C3381F'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Pathwise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a planner's workbench — slim left rail of views, one working surface, drawers slide in from the right. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --sunk:#E7E9E3; --ink:#141A17; --ink2:#525D57; --ink3:#868F8A; --line:#D7DBD4;
  --accent:#2E47CF; --accent-ink:#FFFFFF; --accent-soft:#E2E7FF;
  --crit:#C3381F; --crit-soft:#FAE1DB; --warn:#A86E05; --warn-soft:#F8EBCF; --good:#2A7547; --good-soft:#DBEFE1;
  --bar:#7B8AE4; --bar-done:#A3ADA7; --base:#C5CAC2; --shadow:0 10px 30px rgba(20,26,23,.14);
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D110F; --surface:#151A17; --sunk:#1C221F; --ink:#E4E9E5; --ink2:#A2ACA6; --ink3:#6C7671; --line:#29302C;
  --accent:#8C9DFF; --accent-ink:#0D110F; --accent-soft:#222A4C;
  --crit:#FF7B63; --crit-soft:#3B1C16; --warn:#E6AE48; --warn-soft:#33280F; --good:#62CB8C; --good-soft:#153020;
  --bar:#6474D6; --bar-done:#59625D; --base:#39413C; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D110F; --surface:#151A17; --sunk:#1C221F; --ink:#E4E9E5; --ink2:#A2ACA6; --ink3:#6C7671; --line:#29302C;
  --accent:#8C9DFF; --accent-ink:#0D110F; --accent-soft:#222A4C;
  --crit:#FF7B63; --crit-soft:#3B1C16; --warn:#E6AE48; --warn-soft:#33280F; --good:#62CB8C; --good-soft:#153020;
  --bar:#6474D6; --bar-done:#59625D; --base:#39413C; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.small{font-size:.82rem}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.68rem;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.top .spacer{flex:1}
.top select{max-width:240px}
.sync{font-size:.75rem;color:var(--ink3);white-space:nowrap}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100% - 54px)}
.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(54px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 54px);overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;font-weight:500}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--accent-soft);color:var(--accent)}
.rail a .k{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--ink3)}
.rail .sep{height:1px;background:var(--line);margin:8px 6px}
.rail svg{width:16px;height:16px;flex:none}
main{min-width:0;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:821px){ main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))} }
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:40;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--surface);padding:6px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .rail a{white-space:nowrap;padding:6px 10px}
  .rail a .k,.rail .sep{display:none}
  .top .hide-sm{display:none}
  .top select{max-width:none;flex:1;min-width:0}
}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.iconbtn{border:0;background:transparent;border-radius:6px;padding:6px;cursor:pointer;color:var(--ink2);display:inline-flex}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{resize:vertical;width:100%;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:.78rem;color:var(--ink2);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--ink2);max-width:70ch}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-display);font-size:1.55rem;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--ink2);margin-top:3px}
@media (max-width:1020px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3){border-right:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-right:1px solid var(--line)!important;border-top:1px solid var(--line)}.kpi:nth-child(2n){border-right:0!important}.kpi:nth-child(-n+2){border-top:0}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.66rem;font-weight:600;background:var(--sunk);color:var(--ink2);flex:none;font-family:var(--f-mono)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.crit>i{background:var(--crit)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
.t th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.t input,.t select{padding:3px 6px;width:100%}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--sunk)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:0}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .sev{border-radius:2px;background:var(--ink3)}
.alert.Critical .sev{background:var(--crit)} .alert.High .sev{background:var(--crit);opacity:.7} .alert.Medium .sev{background:var(--warn)} .alert.Low .sev{background:var(--ink3)}
.alert b{font-weight:600}
.alert p{margin:2px 0 0;font-size:.84rem;color:var(--ink2)}
.empty{padding:22px;text-align:center;color:var(--ink3);border:1px dashed var(--line);border-radius:8px}

/* Gantt */
.gantt{position:relative;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 250px);min-height:320px}
.g-inner{position:relative;display:grid}
.g-left{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.g-head{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;top:0;z-index:5;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;align-items:end;padding:0 10px 6px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.g-corner .gr,.g-row{display:grid;grid-template-columns:42px minmax(0,1fr) 30px 64px;gap:6px;align-items:center}
.g-row{height:32px;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.84rem}
.g-row:hover{background:var(--sunk)}
.g-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row.ph{font-weight:600;background:var(--bg)}
.g-row.ph .nm{display:flex;gap:6px;align-items:center}
.g-row .id{font-family:var(--f-mono);font-size:.74rem;color:var(--ink3)}
.g-row.crit .id{color:var(--crit)}
.g-row .fd{font-size:.76rem;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.g-svg text{font-family:var(--f-body)}
.g-svg .bar{cursor:grab}
.g-svg .bar.dragging{cursor:grabbing;opacity:.85}
.g-svg .hnd{cursor:ew-resize}
@media (max-width:620px){.g-corner .gr,.g-row{grid-template-columns:34px minmax(0,1fr)}.g-row .av,.g-row .fd,.g-corner .gr span:nth-child(n+3){display:none}}

/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col>h3{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:7px}
.card:hover{border-color:var(--ink3)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .nm{font-weight:500;line-height:1.35}

/* heat grid */
.heat{display:grid;gap:2px;font-size:.72rem}
.heat .c{height:26px;border-radius:3px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.heat .lab{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;font-size:.8rem;padding-right:6px}
.heat .wk{color:var(--ink3);text-align:center;font-size:.66rem;white-space:nowrap}
.rh{display:grid;grid-template-columns:22px repeat(5,minmax(0,1fr));gap:3px;font-size:.75rem}
.rh .c{aspect-ratio:1.6;max-width:100%;border-radius:4px;display:grid;place-items:center;font-weight:600;cursor:pointer;border:2px solid transparent}
.rh .c.sel{border-color:var(--ink)}
.rh .ax{display:grid;place-items:center;color:var(--ink3)}

/* drawers & modals */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.38);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:90;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer>header h2{flex:1;min-width:0}
.drawer .body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer>footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column}
.modal>header{padding:18px 20px 6px}
.modal .body{padding:12px 20px;display:flex;flex-direction:column;gap:14px}
.modal>footer{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.palette{top:14%;transform:translateX(-50%)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 18px;font-size:1rem;background:transparent}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:center}
.palette li .g{margin-left:auto;font-size:.72rem;color:var(--ink3)}
.palette li.on{background:var(--accent-soft);color:var(--accent)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:9px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.5;font-size:.9rem}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:3px}
.msg.t{align-self:flex-start;background:transparent;border:1px dashed var(--line);font-size:.78rem;color:var(--ink2);padding:5px 10px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;color:var(--ink2)}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}

/* hero (empty state / new) */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding:8px 0}
.hero h1{font-size:clamp(1.8rem,3.4vw,2.6rem)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}

/* docs */
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.doclist{display:flex;flex-direction:column;gap:2px}
.doclist button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.doclist button .mono{font-size:.72rem;color:var(--ink3)}
.doclist button.on{background:var(--accent-soft);color:var(--accent)}
.doclist button:hover:not(.on){background:var(--sunk)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,4vw,44px);min-width:0}
.paper .dh{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.paper h1{font-size:1.6rem}
.paper h2{margin:22px 0 8px;font-size:1.05rem}
.paper p,.paper li{max-width:72ch}
.paper .narr{background:var(--accent-soft);border-radius:8px;padding:14px 16px;white-space:pre-wrap}
@media (max-width:820px){.docs{grid-template-columns:minmax(0,1fr)}.doclist{flex-direction:row;overflow-x:auto}.doclist button{white-space:nowrap}}

/* home */
a.brand{color:inherit;text-decoration:none}
.home-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(20px,3vw,40px);align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px);overflow:hidden}
.home-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,transparent 0 55px,var(--line) 55px 56px);opacity:.55;-webkit-mask-image:linear-gradient(100deg,transparent 35%,#000 95%);mask-image:linear-gradient(100deg,transparent 35%,#000 95%)}
.home-hero>*{position:relative}
.hh-copy{display:flex;flex-direction:column;gap:16px;min-width:0}
.home-hero h1{font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.04;letter-spacing:-.025em;max-width:16ch}
.hh-lead{margin:0;color:var(--ink2);font-size:1.02rem;max-width:56ch}
.idea{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.idea:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.idea textarea{border:0;background:transparent;padding:4px 2px;font-size:1rem;resize:vertical;min-height:96px}
.idea textarea:focus{outline:none}
.idea-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.idea .btn.pri{padding:9px 16px;font-size:.95rem}
.ex-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hh-side{min-width:0}
.hp-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hp-card h3{font-size:1.15rem}
.hp-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-block:1px solid var(--line);padding-block:10px}
.hp-kpis b{display:block;font-family:var(--f-display);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.hp-phases .phase-line{grid-template-columns:minmax(0,120px) minmax(0,1fr) 38px}
.hp-card .btn{align-self:flex-start}
.home-sec{display:flex;flex-direction:column;gap:12px}
.home-sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left}
.pcard.cur{border-color:var(--accent)}
.pc-top{display:flex;gap:6px;align-items:center;min-height:20px}
.pc-desc{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.pc-meta .spacer{flex:1}
.pnew{border-style:dashed;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font:inherit;min-height:200px;background:transparent}
.pnew:hover{border-color:var(--accent);color:var(--accent)}
.pn-plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.feat{background:var(--surface);padding:16px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.feat p{margin:3px 0 0}
.f-ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
@media (max-width:900px){.home-hero{grid-template-columns:minmax(0,1fr)}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.bd-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px}
.bd-kpis>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.bd-kpis b{font-family:var(--f-display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:520px){.bd-kpis{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:120;font-size:.88rem;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:0;color:var(--bg);text-decoration:underline;cursor:pointer;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.85rem}
.banner .btn{color:var(--ink)}
.spark{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.phase-line{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.84rem;padding:5px 0}
.phase-line .track{position:relative;height:10px;background:var(--sunk);border-radius:5px}
.phase-line .track i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--bar)}
.phase-line .track b{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.phase-line .track .td{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}
.kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink3)}
.stream{font-family:var(--f-mono);font-size:.75rem;color:var(--ink3);max-height:120px;overflow:hidden;white-space:pre-wrap;word-break:break-word;mask-image:linear-gradient(transparent,#000 40%)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slin .18s ease-out}@keyframes slin{from{transform:translateX(24px);opacity:.6}}}

<script>
"use strict";
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5;
const D=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd=d=>`${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;
const fdy=d=>`${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
const pct=(v,dp=0)=>`${(v*100).toFixed(dp)}%`;
function money(p,v,compact){const c=p?.currency||"EUR";try{return new Intl.NumberFormat("en-GB",{style:"currency",currency:c,maximumFractionDigits:compact&&Math.abs(v)>=1e4?1:0,notation:compact&&Math.abs(v)>=1e4?"compact":"standard"}).format(v)}catch{return c+" "+Math.round(v)}}

const STATUS={todo:"Not started",doing:"In progress",blocked:"Blocked",review:"Under review",done:"Completed",cancelled:"Cancelled"};
const STATUS_ORDER=["todo","doing","blocked","review","done"];
const CATS={software:"Software & licences",infra:"Infrastructure & hosting",equipment:"Equipment",misc:"Miscellaneous"};
const RISKCAT=["technical","schedule","budget","people","external","compliance"];
const ICON={

 schedule:'<path d="M4 6h9M7 12h11M10 18h8"/><path d="M4 3v18"/>',
 board:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/>',
 team:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.6c2.5.2 4.2 1.8 5 4.4"/>',
 budget:'<path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/>',
 risk:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
 simulate:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/><path d="M4 4l2.5 2.5"/>',
 docs:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 projects:'<path d="M3 7h6l2 2h10v10H3z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>'
};
const ic=(k,sz)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${sz?`width="${sz}" height="${sz}"`:""} aria-hidden="true">${ICON[k]}</svg>`;
const VIEWS=[["overview","Overview","1"],["schedule","Schedule","2"],["board","Board","3"],["team","Team","4"],["budget","Budget","5"],["risk","Risks","6"],["simulate","Forecast","7"],["docs","Documents","8"]];

/* ================= state ================= */
const S={projects:[],cur:null,view:"home",undo:[],redo:[],
  ui:{zoom:"week",collapsed:{},critOnly:false,showBase:true,q:"",owner:"",doc:"charter",riskCell:null,scenario:[],scenarioOut:null,mcN:2000,mcOut:null},
  chat:{},cap:{sample:null,db:null,user:null,downloads:null,tools:false},uidStr:null,syncTimers:{},syncBusy:{},synced:false};
const P=()=>S.projects.find(p=>p.id===S.cur);
const LS_KEY="pf2.projects",LS_CUR="pf2.current";
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}

/* ================= scheduling engine (CPM) ================= */
const memo=new Map();
function stamp(p){return p.id+"|"+p.updatedAt+"|"+todayIso()}
function schedule(p,o={}){
  const st=D(p.start),today=o.today??dateToWd(st,D(todayIso())),mode=o.mode||"forecast";
  const T=p.tasks,byId=new Map(T.map(t=>[t.id,t]));
  const indeg=new Map(),succ=new Map();
  T.forEach(t=>{indeg.set(t.id,0);succ.set(t.id,[])});
  T.forEach(t=>(t.deps||[]).forEach(d=>{if(byId.has(d.id)&&d.id!==t.id){indeg.set(t.id,indeg.get(t.id)+1);succ.get(d.id).push({id:t.id,lag:d.lag||0})}}));
  const q=T.filter(t=>indeg.get(t.id)===0).map(t=>t.id),order=[];
  while(q.length){const id=q.shift();order.push(id);for(const s of succ.get(id)){indeg.set(s.id,indeg.get(s.id)-1);if(indeg.get(s.id)===0)q.push(s.id)}}
  const cyc=order.length<T.length;
  if(cyc)T.forEach(t=>{if(!order.includes(t.id))order.push(t.id)});
  const R={};
  for(const id of order){
    const t=byId.get(id);
    let es=t.snet?Math.max(0,dateToWd(st,D(t.snet))):0;
    for(const d of t.deps||[]){const r=R[d.id];if(r)es=Math.max(es,r.ef+(d.lag||0))}
    let dur=o.dur&&o.dur[id]!=null?o.dur[id]:t.dur;
    if(t.status==="cancelled")dur=0;
    const pr=t.status==="done"?100:(t.progress||0);
    let ef;
    if(mode==="plan"||pr>=100||t.status==="cancelled")ef=es+dur;
    else{const rem=Math.ceil(dur*(1-pr/100));
      if(pr>0)ef=es<today?Math.max(es+dur,today+rem):es+dur;
      else{if(es<today)es=today;ef=es+dur}}
    R[id]={es,ef,dur:ef-es};
  }
  let end=0,fin=0;
  for(const id in R){const r=R[id];end=Math.max(end,r.ef);fin=Math.max(fin,r.dur>0?r.ef-1:r.es)}
  for(let i=order.length-1;i>=0;i--){const id=order[i],r=R[id];let lf=end;for(const s of succ.get(id))if(R[s.id].ls!=null)lf=Math.min(lf,R[s.id].ls-s.lag);
    r.lf=lf;r.ls=lf-r.dur;r.slack=r.ls-r.es;r.crit=r.slack<=0&&byId.get(id).status!=="cancelled"}
  return {R,end,fin,today,order,succ,cyc,st};
}
function triParams(t){const m=t.dur;return[t.opt??Math.max(m>1?1:m,Math.round(m*.8)),m,t.pess??Math.ceil(m*1.5)]}
function monteCarlo(p,N=1000,seed=7,extra){
  const r=mulberry(seed),fins=new Array(N),critCount={};
  const open=p.tasks.filter(t=>t.status!=="done"&&t.status!=="cancelled"&&(t.progress||0)<100&&t.dur>0);
  const st=D(p.start),today=dateToWd(st,D(todayIso()));
  for(let i=0;i<N;i++){
    const dur={};for(const t of open){const [a,m,b]=triParams(t);dur[t.id]=Math.max(1,Math.round(tri(r,a,m,b)))}
    const s=schedule(p,{dur,today});fins[i]=s.fin;
    for(const t of open)if(s.R[t.id].crit)critCount[t.id]=(critCount[t.id]||0)+1;
  }
  const sorted=[...fins].sort((a,b)=>a-b),q=f=>sorted[Math.min(N-1,Math.floor(f*N))];
  const tgt=dateToWd(st,D(p.target));
  const onTime=fins.filter(f=>f<=tgt).length/N;
  const crit=Object.entries(critCount).map(([id,c])=>({id,ci:c/N})).sort((a,b)=>b.ci-a.ci);
  return {N,fins:sorted,p10:q(.1),p50:q(.5),p80:q(.8),p90:q(.9),onTime,crit,tgt};
}
function calc(p){
  const k=stamp(p);if(memo.has(k))return memo.get(k);
  const sch=schedule(p),st=sch.st,today=sch.today;
  const mem=new Map(p.team.map(m=>[m.id,m]));
  const rate=t=>mem.get(t.owner)?.rate||0;
  const live=p.tasks.filter(t=>t.status!=="cancelled");
  const effTot=live.reduce((a,t)=>a+(t.effort||0),0)||1;
  const prog=live.reduce((a,t)=>a+(t.effort||0)*(t.status==="done"?1:(t.progress||0)/100),0)/effTot;
  const laborBAC=live.reduce((a,t)=>a+(t.effort||0)*rate(t),0);
  const nl=Object.keys(CATS).reduce((a,c)=>a+(+p.lines[c]||0),0);
  const BAC=laborBAC+nl;
  const actualLabor=p.tasks.reduce((a,t)=>a+(t.actualHours||0)*rate(t),0);
  const exA=p.expenses.filter(e=>e.status==="actual"),exC=p.expenses.filter(e=>e.status==="committed");
  const AC=actualLabor+exA.reduce((a,e)=>a+ +e.amount,0);
  const committed=exC.reduce((a,e)=>a+ +e.amount,0);
  const EV=live.reduce((a,t)=>a+(t.effort||0)*rate(t)*(t.status==="done"?1:(t.progress||0)/100),0)+nl*prog;
  const B=p.baseline||{};let bEnd=1;for(const id in B)bEnd=Math.max(bEnd,B[id].ef);
  const PVat=ti=>{let v=0;for(const t of live){const b=B[t.id];if(!b)continue;const c=(t.effort||0)*rate(t);const d=Math.max(1,b.ef-b.es);v+=c*clamp((ti-b.es)/d,0,1)}return v+nl*clamp(ti/bEnd,0,1)};
  const PV=PVat(today);
  const CPI=AC>0?EV/AC:1,SPI=PV>0?EV/PV:1;
  const EAC=AC+(BAC-EV)/Math.max(CPI,.05);
  const plannedProg=laborBAC?(PVat(today)-nl*clamp(today/bEnd,0,1))/laborBAC:0;
  let bFin=0;for(const id in B){const b=B[id];bFin=Math.max(bFin,b.ef-b.es>0?b.ef-1:b.es)}
  const tgt=dateToWd(st,D(p.target));
  // resource load per week
  const weeks=Math.max(1,Math.ceil((Math.max(sch.end,tgt)+1)/5));
  const load={};p.team.forEach(m=>load[m.id]=new Array(weeks).fill(0));
  for(const t of live){const r=sch.R[t.id];if(!t.owner||!load[t.owner]||r.dur<=0)continue;const h=(t.effort||0)/r.dur;for(let i=r.es;i<r.ef;i++){const w=Math.floor(i/5);if(w<weeks)load[t.owner][w]+=h}}
  const counts={};STATUS_ORDER.concat("cancelled").forEach(s=>counts[s]=0);p.tasks.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);
  const out={sch,st,today,prog,plannedProg,laborBAC,nl,BAC,AC,EV,PV,PVat,CPI,SPI,EAC,committed,actualLabor,bFin,bEnd,tgt,load,weeks,counts,
    finDate:wdToDate(st,sch.fin),tgtDate:D(p.target),slip:sch.fin-tgt,baseSlip:sch.fin-bFin,mem};
  out.alerts=alerts(p,out);
  out.health=Math.max(0,100-out.alerts.reduce((a,x)=>a+({Critical:18,High:10,Medium:5,Low:2}[x.sev]),0));
  memo.clear();memo.set(k,out);return out;
}
function mcFor(p){const k="mc|"+stamp(p);if(S._mc&&S._mc.k===k)return S._mc.v;const v=monteCarlo(p,600,11);S._mc={k,v};return v}
function tDates(c,t){const r=c.sch.R[t.id];const s=wdToDate(c.st,r.es),f=r.dur>0?wdToDate(c.st,r.ef-1):s;return{s,f,r}}
function alerts(p,c){
  const A=[],R=c.sch.R,byId=new Map(p.tasks.map(t=>[t.id,t]));const today=c.today;
  if(c.slip>0)A.push({sev:"Critical",kind:"schedule",title:`Forecast finish is ${c.slip} working days after the target`,ev:`Forecast ${fdy(wdToDate(c.st,c.sch.fin))} vs target ${fdy(c.tgtDate)}.`,act:"Look at the critical path on the Schedule view, or test options on Forecast & what-if."});
  for(const t of p.tasks){
    if(t.status==="done"||t.status==="cancelled")continue;const r=R[t.id];
    if(t.status==="blocked"){const su=(c.sch.succ.get(t.id)||[]).map(s=>s.id);
      A.push({sev:"High",kind:"blocked",task:t.id,title:`${t.id} ${t.name} is blocked`,ev:su.length?`${su.length} task(s) wait on it: ${su.join(", ")}.`:"No tasks depend on it.",act:"Escalate the blocker and record when it will be cleared."});
      for(const s of su){const st=byId.get(s);if(st&&st.status!=="done")A.push({sev:"Medium",kind:"dep",task:s,title:`${s} waits on blocked task ${t.id}`,ev:`${s} ${st.name} has a finish-to-start link to ${t.id}.`,act:"Clear the predecessor or change the dependency."})}}
    const b=p.baseline?.[t.id];
    if(r.dur>0&&r.es<today&&t.dur>0){const exp=clamp((today-r.es)/Math.max(1,(b?b.ef-b.es:t.dur)),0,1);const pr=(t.progress||0)/100;
      if(r.ef-today<=3&&r.ef>=today&&pr<exp-.15)A.push({sev:"High",kind:"deadline",task:t.id,title:`${t.id} ${t.name} is due within 3 working days`,ev:`Due ${fd(wdToDate(c.st,r.ef-1))}; ${Math.round(pr*100)}% done, about ${Math.round(exp*100)}% expected by now.`,act:"Confirm the remaining effort with the owner; add help or split the task."});}
    const preSlip=Math.max(0,...(t.deps||[]).map(d=>{const pr=R[d.id],pb=p.baseline?.[d.id];return pr&&pb?pr.ef-pb.ef:0}));
    if(b&&r.ef-b.ef>=3&&r.ef-b.ef-preSlip>=3&&r.crit&&!A.some(a=>a.task===t.id))A.push({sev:"Medium",kind:"slip",task:t.id,title:`${t.id} has slipped ${r.ef-b.ef} working days past baseline`,ev:`On the critical path, so the slip moves the finish date.`,act:"Recover time on this task or a successor."});
  }
  for(const m of p.team){const L=c.load[m.id]||[];const cap=m.capacity||40;const over=L.map((h,i)=>({h,i})).filter(x=>x.h>cap*1.1&&x.i>=Math.floor(today/5));
    if(over.length){const pk=over.reduce((a,x)=>x.h>a.h?x:a);A.push({sev:pk.h>cap*1.4?"High":"Medium",kind:"load",member:m.id,title:`${m.name} is overallocated`,ev:`${over.length} upcoming week(s) above ${cap} h; peak ${Math.round(pk.h)} h in the week of ${fd(wdToDate(c.st,pk.i*5))}.`,act:"Move a task to someone with spare capacity on the Team view, or stretch its duration."})}}
  if(c.EAC>p.budget)A.push({sev:"Critical",kind:"budget",title:"Estimate at completion exceeds the approved budget",ev:`EAC ${money(p,c.EAC)} vs budget ${money(p,p.budget)}.`,act:"Review scope, rates or the contingency reserve on the Budget view."});
  else if(c.CPI<.9&&c.AC>0)A.push({sev:"High",kind:"budget",title:`Cost performance is below plan (CPI ${c.CPI.toFixed(2)})`,ev:`Earned ${money(p,c.EV)} for ${money(p,c.AC)} spent.`,act:"Find the categories that are over and agree a recovery plan."});
  for(const k of p.risks){if(k.status!=="closed"&&k.p*k.i>=15)A.push({sev:"Medium",kind:"risk",title:`Register risk “${k.title}” is rated ${k.p}×${k.i}`,ev:k.mitigation?`Mitigation: ${k.mitigation}`:"No mitigation recorded.",act:"Check the mitigation is under way and has an owner."})}
  const order={Critical:0,High:1,Medium:2,Low:3};return A.sort((a,b)=>order[a.sev]-order[b.sev]);
}

function loadLocal(){
  try{const raw=lsGet(LS_KEY);if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length)S.projects=arr}}catch{}
  if(!S.projects.length)S.projects=[makeSample()];

}
let lsTimer=null;
function saveLocal(){clearTimeout(lsTimer);lsTimer=setTimeout(()=>{lsSet(LS_KEY,JSON.stringify(S.projects));lsSet(LS_CUR,S.cur)},250)}
function colRef(){return S.cap.db&&S.uidStr?S.cap.db.collection("data/users/"+S.uidStr):null}
function scheduleSync(p){const col=colRef();if(!col)return;clearTimeout(S.syncTimers[p.id]);S.syncTimers[p.id]=setTimeout(()=>pushRemote(p.id),1500);setSync("Saving…")}
async function pushRemote(id){
  const col=colRef(),p=S.projects.find(x=>x.id===id);if(!col||!p)return;
  if(S.syncBusy[id]){S.syncTimers[id]=setTimeout(()=>pushRemote(id),800);return}
  S.syncBusy[id]=true;
  try{await col.doc(id).set({name:p.name,updatedAt:p.updatedAt,json:JSON.stringify(p)});setSync("Synced to your account")}
  catch(e){setSync(e&&e.code==="quota_exceeded"?"Account storage full; saved in this browser":"Saved in this browser (sync failed)")}
  finally{S.syncBusy[id]=false}
}
async function removeRemote(id){const col=colRef();if(!col)return;try{await col.doc(id).delete()}catch{}}
function setSync(t){const e=$("#syncState");if(e)e.textContent=t}
function persist(p){saveLocal();if(p)scheduleSync(p)}
async function initCaps(){
  const cl=window.claude;if(!cl||typeof cl.use!=="function"){$("#askBtn").hidden=true;return}
  const get=n=>cl.use(n).catch(()=>null);
  const [sample,db,user,downloads]=await Promise.all([get("sample"),get("db"),get("user"),get("downloads")]);
  Object.assign(S.cap,{sample,db,user,downloads});
  if(sample){try{const l=await sample.limits();S.cap.tools=!!l?.tools}catch{}}
  if(db&&user){try{S.uidStr=await user.id()}catch{}}
  if(colRef()){
    try{const snap=await colRef().get();let changed=false;
      for(const d of snap.docs){const b=d.data();if(!b||!b.json)continue;let rp;try{rp=JSON.parse(b.json)}catch{continue}
        const i=S.projects.findIndex(x=>x.id===rp.id);
        if(i<0){S.projects.push(rp);changed=true}else if((rp.updatedAt||0)>(S.projects[i].updatedAt||0)){S.projects[i]=rp;changed=true}}
      const remoteIds=new Set(snap.docs.map(d=>d.id));
      for(const p of S.projects)if(!remoteIds.has(p.id))await pushRemote(p.id);
      setSync("Synced to your account");S.synced=true;
      if(changed){memo.clear();saveLocal();render()}
    }catch{setSync("Saved in this browser")}
  }
  $("#askBtn").hidden=!S.cap.sample;render();
}

/* ================= mutations, undo ================= */
function commit(label,fn,opts={}){
  const p=P();if(!p)return;
  S.undo.push({id:p.id,json:JSON.stringify(p),label});if(S.undo.length>50)S.undo.shift();S.redo=[];
  const r=fn(p);
  p.updatedAt=Date.now();
  if(label){p.log.unshift({t:Date.now(),msg:label});p.log.length=Math.min(p.log.length,80)}
  memo.clear();S.ui.scenarioOut=null;persist(p);
  if(!opts.silent)render();
  if(label&&!opts.noToast)toast(label,true);
  return r;
}
function swapIn(json){const np=JSON.parse(json);const i=S.projects.findIndex(x=>x.id===np.id);if(i>=0)S.projects[i]=np;else S.projects.push(np);S.cur=np.id;memo.clear();persist(np);render()}
function undo(){const u=S.undo.pop();if(!u)return;const cur=S.projects.find(x=>x.id===u.id);S.redo.push({id:u.id,json:JSON.stringify(cur),label:u.label});swapIn(u.json);toast("Undid: "+(u.label||"change"))}
function redo(){const u=S.redo.pop();if(!u)return;const cur=S.projects.find(x=>x.id===u.id);S.undo.push({id:u.id,json:JSON.stringify(cur),label:u.label});swapIn(u.json);toast("Redid: "+(u.label||"change"))}
let toastT;
function toast(msg,withUndo){clearTimeout(toastT);$(".toast")?.remove();const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");
  el.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button type="button">Undo</button>':""}`;document.body.append(el);
  el.querySelector("button")?.addEventListener("click",()=>{undo();el.remove()});toastT=setTimeout(()=>el.remove(),4200)}
function nextTaskId(p){let n=0;p.tasks.forEach(t=>{const m=/^T(\d+)$/.exec(t.id);if(m)n=Math.max(n,+m[1])});return "T"+String(n+1).padStart(2,"0")}

     <div class="track"><i style="left:${es/tot*100}%;width:${Math.max(.6,(ef-es)/tot*100)}%"></i><b style="left:${es/tot*100}%;width:${Math.max(0,(ef-es)/tot*100*pr)}%"></b>${f===p.phases[0]?`<span class="td" style="left:${c.today/tot*100}%" title="Today"></span>`:""}</div>

function ganttRows(p,c){

/* ---- burndown: remaining planned effort (hours) over working days ---- */
function burndown(p,c){
  const live=p.tasks.filter(t=>t.status!=="cancelled"&&(t.effort||0)>0);
  const total=live.reduce((a,t)=>a+t.effort,0);
  const prOf=t=>t.status==="done"?1:clamp((t.progress||0)/100,0,1);
  const remNow=live.reduce((a,t)=>a+t.effort*(1-prOf(t)),0);
  const tgt=Math.max(1,c.tgt),t0=Math.max(0,c.today);
  const idealAt=d=>total*Math.max(0,1-d/tgt);
  const end=Math.max(c.sch.end,t0+1),fc=[];
  for(let d=t0;d<=end;d++){let r=0;
    for(const t of live){const R=c.sch.R[t.id],left=t.effort*(1-prOf(t));if(left<=0)continue;const a=Math.max(R.es,t0),b=Math.max(R.ef,a+1);r+=d<=a?left:d>=b?0:left*(b-d)/(b-a)}
    fc.push([d,r])}
  const hist=(p.history||[]).filter(h=>h.wd>0&&h.wd<t0).map(h=>[h.wd,h.rem!=null?h.rem:total*clamp(1-(c.BAC?h.ev/c.BAC:0),0,1)]);
  const actual=c.today>0?[[0,total],...hist,[t0,remNow]]:[[0,total]];
  const rate=total/tgt,diff=remNow-idealAt(t0);
  return {total,remNow,ideal:idealAt(t0),idealAt,fc,actual,tgt,end,t0,diff,daysOff:rate>0?diff/rate:0,sample:(p.history||[]).some(h=>h.sample)};
}
function burndownPanel(p,c,compact){

  const X=d=>L+(W-L-Rm)*d/xmax,Y=v=>T+(H-T-Bm)*(1-v/ymax);

  const step=Math.max(5,Math.ceil(xmax/8/5)*5);for(let i=0;i<=xmax;i+=step)g+=`<text x="${X(i)}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="var(--ink3)">${fd(wdToDate(c.st,i))}</text>`;
  const path=pts=>pts.map(([d,v],i)=>(i?"L":"M")+X(d).toFixed(1)+" "+Y(v).toFixed(1)).join("");
  const act=path(B.actual),last=B.actual[B.actual.length-1];

   <div class="bd-kpis"><div><span class="eyebrow">Work left</span><b>${Math.round(B.remNow).toLocaleString("en-GB")} h</b><span class="small muted">of ${Math.round(B.total).toLocaleString("en-GB")} h planned</span></div>
    <div><span class="eyebrow">Ideal by today</span><b>${Math.round(B.ideal).toLocaleString("en-GB")} h</b><span class="small muted">straight line to ${fd(c.tgtDate)}</span></div>
    <div><span class="eyebrow">Reaches zero</span><b style="color:var(--${late?"crit":"ink"})">${fd(c.finDate)}</b><span class="small muted">${late?`${c.slip} wd after target`:`${-c.slip} wd before target`}</span></div></div>

    <line x1="${X(B.tgt)}" x2="${X(B.tgt)}" y1="${T}" y2="${H-Bm}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${X(B.tgt)>W-70?X(B.tgt)-4:X(B.tgt)+4}" y="${T+10}" font-size="10" fill="var(--warn)" font-weight="600" text-anchor="${X(B.tgt)>W-70?"end":"start"}">TARGET</text>

    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="var(--accent)"/>

   <div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>work left (actual)</span><span><i style="background:var(--accent);opacity:.6"></i>forecast (dashed)</span><span><i style="background:var(--ink3)"></i>ideal line (dashed)</span><span><i style="background:var(--warn)"></i>target date</span></div>
   ${B.sample&&!compact?`<p class="small faint" style="margin:6px 0 0">Earlier points are illustrative sample history. Real projects record one point per day you open them.</p>`:""}</section>`;
}
function sCurve(p,c){
  const W=760,H=260,L=56,Rm=16,T=14,B=30;const end=Math.max(c.bEnd,c.sch.end,c.tgt)+2;
  const ymax=Math.max(p.budget,c.EAC,c.AC)*1.06;
  const X=i=>L+(W-L-Rm)*i/end,Y=v=>T+(H-T-B)*(1-v/ymax);
  let g="";const ticks=4;for(let i=0;i<=ticks;i++){const v=ymax*i/ticks;g+=`<line x1="${L}" x2="${W-Rm}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" font-size="10.5" text-anchor="end" fill="var(--ink3)">${money(p,v,true)}</text>`}
  const step=Math.max(5,Math.ceil(end/8/5)*5);for(let i=0;i<=end;i+=step)g+=`<text x="${X(i)}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="var(--ink3)">${fd(wdToDate(c.st,i))}</text>`;
  let pv="";for(let i=0;i<=c.bEnd;i++)pv+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(c.PVat(i)).toFixed(1);
  const hist=[{wd:0,ev:0,ac:0},...p.history.filter(h=>h.wd<c.today),{wd:c.today,ev:c.EV,ac:c.AC}];
  const ln=k=>hist.map((h,i)=>(i?"L":"M")+X(h.wd).toFixed(1)+" "+Y(h[k]).toFixed(1)).join("");
  // forecast AC to EAC
  const fx=`M${X(c.today)} ${Y(c.AC)}L${X(c.sch.end)} ${Y(c.EAC)}`;
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" class="spark" style="min-width:520px" role="img" aria-label="Planned value, earned value and actual cost over time">${g}
   <line x1="${L}" x2="${W-Rm}" y1="${Y(p.budget)}" y2="${Y(p.budget)}" stroke="var(--warn)" stroke-dasharray="5 4"/>
   <path d="${pv}" fill="none" stroke="var(--ink3)" stroke-width="2"/>
   <path d="${ln("ev")}L${X(c.today)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="var(--accent)" opacity=".1"/>
   <path d="${ln("ev")}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
   <path d="${ln("ac")}" fill="none" stroke="var(--crit)" stroke-width="2.4"/>
   <path d="${fx}" fill="none" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>
   <circle cx="${X(c.sch.end)}" cy="${Y(c.EAC)}" r="4" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/><text x="${X(c.sch.end)-6}" y="${Y(c.EAC)-8}" font-size="10.5" text-anchor="end" fill="var(--crit)">EAC ${money(p,c.EAC,true)}</text>
   <circle cx="${X(c.today)}" cy="${Y(c.EV)}" r="4" fill="var(--accent)"/><circle cx="${X(c.today)}" cy="${Y(c.AC)}" r="4" fill="var(--crit)"/>
   <line x1="${X(c.today)}" x2="${X(c.today)}" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-dasharray="2 3"/><text x="${X(c.today)+4}" y="${T+10}" font-size="10" fill="var(--ink2)">today</text></svg></div>`;
}

function changeFields(p,ch,i){
  const tsel=k=>`<select data-ch="${i}" data-f="${k}" aria-label="Task">${p.tasks.filter(t=>t.status!=="done").map(t=>`<option value="${t.id}" ${ch[k]===t.id?"selected":""}>${t.id} ${esc(t.name.slice(0,40))}</option>`).join("")}</select>`;
  const msel=(k,all)=>`<select data-ch="${i}" data-f="${k}" aria-label="Person">${all?`<option value="">Everyone</option>`:""}${p.team.map(m=>`<option value="${m.id}" ${ch[k]===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`;
  const psel=k=>`<select data-ch="${i}" data-f="${k}" aria-label="Phase"><option value="">All phases</option>${p.phases.map(f=>`<option value="${f.id}" ${ch[k]===f.id?"selected":""}>${esc(f.name)}</option>`).join("")}</select>`;
  const num=(k,lab,w=80)=>`<label class="small muted" style="display:inline-flex;gap:5px;align-items:center">${lab}<input type="number" data-ch="${i}" data-f="${k}" value="${ch[k]??""}" style="width:${w}px"></label>`;
  switch(ch.type){
    case"delay":return tsel("task")+num("days","by working days");
    case"unavailable":return msel("member")+`<label class="small muted" style="display:inline-flex;gap:5px;align-items:center">from<input type="date" data-ch="${i}" data-f="from" value="${ch.from||todayIso()}"></label>`+num("days","for working days");
    case"productivity":return msel("member",true)+num("pct","productivity %");
    case"scope":return psel("phase")+num("pct","remaining work +/- %");
    case"budget":return num("amount","add to budget",110);
    case"rate":return num("pct","rates +/- %");
    case"target":return `<input type="date" data-ch="${i}" data-f="date" value="${ch.date||p.target}">`;
  }return"";
}
function applyChanges(p0,changes){
  const p=JSON.parse(JSON.stringify(p0));const c0=calc(p0);
  for(const ch of changes){
    if(ch.type==="delay"){const t=p.tasks.find(x=>x.id===ch.task);if(t){const r=c0.sch.R[t.id],n=+ch.days||0;if((t.progress||0)>0||r.es<=c0.today){t.dur+=n;if(t.pess)t.pess+=n;if(t.opt)t.opt+=n}else t.snet=iso(wdToDate(c0.st,r.es+n))}}
    if(ch.type==="unavailable"){const f=dateToWd(c0.st,D(ch.from||todayIso())),to=f+(+ch.days||0);
      for(const t of p.tasks){if(t.owner!==ch.member||t.status==="done")continue;const r=c0.sch.R[t.id];if(r.es<to&&r.ef>f){if(r.es>=f)t.snet=iso(wdToDate(c0.st,to));else t.dur+=Math.min(to,r.ef)-Math.max(f,r.es)}}}
    if(ch.type==="productivity"){const k=100/Math.max(10,+ch.pct||100);for(const t of p.tasks)if(t.status!=="done"&&t.dur>0&&(!ch.member||t.owner===ch.member)){t.dur=Math.max(1,Math.round(t.dur*k));if(t.opt)t.opt=Math.round(t.opt*k);if(t.pess)t.pess=Math.round(t.pess*k)}}
    if(ch.type==="scope"){const k=1+(+ch.pct||0)/100;for(const t of p.tasks)if(t.status!=="done"&&t.dur>0&&(!ch.phase||t.phase===ch.phase)){const rem=1-(t.progress||0)/100;t.dur=Math.max(1,Math.round(t.dur*(1-rem+rem*k)));t.effort=Math.round(t.effort*(1-rem+rem*k));if(t.opt)t.opt=Math.max(1,Math.round(t.opt*k));if(t.pess)t.pess=Math.round(t.pess*k)}}
    if(ch.type==="budget")p.budget+= +ch.amount||0;
    if(ch.type==="rate")p.team.forEach(m=>m.rate=Math.round(m.rate*(1+(+ch.pct||0)/100)*100)/100);
    if(ch.type==="target"&&ch.date)p.target=ch.date;
  }
  p.updatedAt=Date.now()+1;p.id=p0.id+"~sim";return p;
}
function scenarioView(p,c,o){
  const s=o.c,ma=o.mcA,mb=o.mcB;

  const moved=p.tasks.map(t=>({t,a:c.sch.R[t.id],b:s.sch.R[t.id]})).filter(x=>x.b&&(x.b.ef!==x.a.ef)).sort((x,y)=>(y.b.ef-y.a.ef)-(x.b.ef-x.a.ef)).slice(0,8);
  return `<div class="grid2" style="margin-top:14px"><div class="tbl-wrap"><table class="t"><thead><tr><th></th><th class="r">Current</th><th class="r">Scenario</th><th></th></tr></thead><tbody>
   ${row("Forecast finish",fdy(c.finDate),fdy(s.finDate),s.sch.fin===c.sch.fin?null:s.sch.fin<c.sch.fin)}

   ${row("P80 finish",fd(wdToDate(c.st,ma.p80)),fd(wdToDate(c.st,mb.p80)),mb.p80===ma.p80?null:mb.p80<ma.p80)}

   ${row("Budget",money(p,p.budget),money(p,o.p.budget),null)}
   ${row("Health",c.health,s.health,s.health===c.health?null:s.health>c.health)}</tbody></table></div>
   <div><h3 style="margin-bottom:6px">Tasks that move</h3>${moved.length?`<div class="small">${moved.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)"><span><span class="mono faint">${x.t.id}</span> ${esc(x.t.name)}</span><span class="pill ${x.b.ef>x.a.ef?"crit":"good"}">${x.b.ef>x.a.ef?"+":""}${x.b.ef-x.a.ef} wd</span></div>`).join("")}</div>`:`<p class="faint small">No task dates change.</p>`}
   <div class="toolbar" style="margin-top:12px"><button class="btn pri" data-act="applyScenario">Apply to live plan</button><button class="btn ghost" data-act="discardScenario">Discard</button></div></div></div>`;
}
function mcView(p,c,mc){
  const W=760,H=230,L=40,R=16,T=18,B=36;const lo=mc.fins[0],hi=mc.fins[mc.N-1];const span=Math.max(1,hi-lo+1);
  const bins=new Array(span).fill(0);mc.fins.forEach(f=>bins[f-lo]++);const ymax=Math.max(...bins);
  const lo2=Math.min(lo,mc.tgt)-1,hi2=Math.max(hi,mc.tgt)+1;const X=i=>L+(W-L-R)*(i-lo2)/(hi2-lo2+1),bw=Math.max(2,(W-L-R)/(hi2-lo2+1)-1.5);
  let bars="";let cum=0;bins.forEach((n,k)=>{cum+=n;const i=lo+k;const h=(H-T-B)*n/ymax;bars+=`<rect x="${X(i)}" y="${H-B-h}" width="${bw}" height="${h}" rx="1.5" fill="${i<=mc.tgt?"var(--good)":"var(--bar)"}" opacity=".85"><title>${fd(wdToDate(c.st,i))}: ${n} runs (${pct(cum/mc.N)} finish by this date)</title></rect>`});
  const vl=(i,l,col,y)=>`<line x1="${X(i)+bw/2}" x2="${X(i)+bw/2}" y1="${T-4}" y2="${H-B}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(i)+bw/2+4}" y="${y}" font-size="10.5" fill="${col}" font-weight="600">${l}</text>`;
  let ax="";const st=Math.max(1,Math.ceil((hi2-lo2)/7));for(let i=lo2;i<=hi2;i+=st)ax+=`<text x="${X(i)+bw/2}" y="${H-B+16}" font-size="10.5" text-anchor="middle" fill="var(--ink3)">${fd(wdToDate(c.st,i))}</text>`;
  const top=mc.crit.slice(0,8);
  return `<div class="grid3" style="margin-bottom:12px">
   <div><div class="eyebrow">50% likely by</div><div style="font-family:var(--f-display);font-size:1.4rem;font-weight:600">${fdy(wdToDate(c.st,mc.p50))}</div></div>
   <div><div class="eyebrow">80% likely by</div><div style="font-family:var(--f-display);font-size:1.4rem;font-weight:600">${fdy(wdToDate(c.st,mc.p80))}</div></div>
   <div><div class="eyebrow">Chance of meeting ${fd(c.tgtDate)}</div><div style="font-family:var(--f-display);font-size:1.4rem;font-weight:600;color:var(--${mc.onTime>=.8?"good":mc.onTime>=.5?"warn":"crit"})">${pct(mc.onTime)}</div></div></div>
  <div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" class="spark" style="min-width:520px" role="img" aria-label="Histogram of simulated finish dates">
   <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>${bars}${ax}
   ${vl(mc.tgt,"target","var(--warn)",T+2)}${vl(mc.p50,"P50","var(--ink2)",T+16)}${vl(mc.p80,"P80","var(--accent)",T+30)}</svg></div>
  <p class="small muted" style="margin:6px 0 14px">${mc.N.toLocaleString()} runs. Green bars finish on or before the target. Deterministic forecast: ${fd(c.finDate)}.</p>
  <h3 style="margin-bottom:6px">Where the risk sits</h3><p class="small muted" style="margin:0 0 8px">Criticality index: the share of runs in which a task was on the critical path. High values mean that task's duration drives the finish date.</p>
  ${top.map(x=>{const t=p.tasks.find(y=>y.id===x.id);return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:10px;align-items:center;padding:3px 0" class="small"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="mono faint">${x.id}</span> ${esc(t?.name)}</span><div class="bar ${x.ci>.7?"crit":x.ci>.35?"warn":""}"><i style="width:${x.ci*100}%"></i></div><span class="num" style="text-align:right">${pct(x.ci)}</span></div>`}).join("")}`;
}

/* ---- everything in one ZIP ---- */
async function zipAllBlob(p){
  const JSZip=await lib("jszip");const z=new JSZip(),base=slug(p.name);
  for(const [key] of DOCS){
    const fb=docFileBase(p,key);
    z.file(`Word/${fb}.docx`,await docxBytes(p,key,"uint8array"));
    z.file(`PDF/${fb}.pdf`,await docPDFBytes(p,key));
  }
  z.file(`${base}_gantt.pdf`,await ganttPDFBytes(p));
  z.file(`${base}_workbook.xlsx`,await xlsxBytes(p,"uint8array"));

function assistantTools(){
  const changed=[];
  const note=x=>{changed.push(x);const log=$("#chatLog");if(log){log.insertAdjacentHTML("beforeend",`<div class="msg t">${esc(x)}</div>`)}};
  return {changed,tools:[
   {name:"list_tasks",description:"List tasks with dates, status, progress, owner, slack and critical flag. Optional filters. Returns an array.",inputSchema:{type:"object",properties:{status:{type:"string",enum:Object.keys(STATUS)},ownerId:{type:"string"},phaseId:{type:"string"},criticalOnly:{type:"boolean"}}},
    execute:(i)=>{const p=P(),c=calc(p);note("Read the task list");return p.tasks.filter(t=>(!i.status||t.status===i.status)&&(!i.ownerId||t.owner===i.ownerId)&&(!i.phaseId||t.phase===i.phaseId)&&(!i.criticalOnly||c.sch.R[t.id].crit)).map(t=>taskRow(p,c,t))}},
   {name:"update_task",description:"Change one task. Only pass fields to change. status is one of todo, doing, blocked, review, done, cancelled. Returns the updated task.",inputSchema:{type:"object",properties:{id:{type:"string"},name:{type:"string"},status:{type:"string",enum:Object.keys(STATUS)},progress:{type:"number"},durationDays:{type:"number"},ownerId:{type:"string"},effortHours:{type:"number"},startNoEarlierThan:{type:"string",description:"YYYY-MM-DD"},deps:{type:"array",items:{type:"string"}}},required:["id"]},
    execute:(i)=>{const p=P();const id=String(i.id).toUpperCase();const t=p.tasks.find(x=>x.id===id);if(!t)throw new Error("No task "+id);
      if(i.ownerId&&!p.team.some(m=>m.id===i.ownerId))throw new Error("Unknown ownerId");
      if(i.deps){for(const d of i.deps)if(!p.tasks.some(x=>x.id===String(d).toUpperCase()))throw new Error("Unknown dependency "+d)}
      const parts=[];
      commit(`Assistant updated ${id}`,p=>{const x=p.tasks.find(y=>y.id===id);
        if(i.name!=null){x.name=String(i.name);parts.push("name")}
        if(i.status&&STATUS[i.status]){x.status=i.status;parts.push("status "+STATUS[i.status])}
        if(i.progress!=null){x.progress=clamp(Math.round(+i.progress),0,100);parts.push(x.progress+"%")}
        if(i.durationDays!=null){x.dur=Math.max(0,Math.round(+i.durationDays));parts.push(x.dur+" days")}
        if(i.ownerId){x.owner=i.ownerId;parts.push("owner "+p.team.find(m=>m.id===i.ownerId).name)}
        if(i.effortHours!=null){x.effort=Math.max(0,+i.effortHours);parts.push(x.effort+" h")}
        if(i.startNoEarlierThan){x.snet=String(i.startNoEarlierThan).slice(0,10);parts.push("start ≥ "+x.snet)}
        if(i.deps){x.deps=i.deps.map(d=>({id:String(d).toUpperCase(),lag:0}));parts.push("dependencies")}
        if(x.status==="done")x.progress=100;else if(x.progress>=100)x.status="done"},{noToast:true});
      note(`Changed ${id}: ${parts.join(", ")}`);const p2=P();return taskRow(p2,calc(p2),p2.tasks.find(x=>x.id===id))}},
   {name:"add_task",description:"Add a task to a phase. Returns the new task with its ID.",inputSchema:{type:"object",properties:{name:{type:"string"},phaseId:{type:"string"},durationDays:{type:"number"},ownerId:{type:"string"},effortHours:{type:"number"},deps:{type:"array",items:{type:"string"}}},required:["name","phaseId","durationDays"]},
    execute:(i)=>{const p=P();if(!p.phases.some(f=>f.id===i.phaseId))throw new Error("Unknown phaseId");const id=nextTaskId(p);
      commit(`Assistant added ${id}`,p=>{p.tasks.push({id,name:String(i.name),phase:i.phaseId,dur:Math.max(0,Math.round(+i.durationDays||1)),deps:(i.deps||[]).map(d=>String(d).toUpperCase()).filter(d=>p.tasks.some(x=>x.id===d)).map(d=>({id:d,lag:0})),owner:p.team.some(m=>m.id===i.ownerId)?i.ownerId:"",effort:+i.effortHours||Math.round((+i.durationDays||1)*6),progress:0,status:"todo",actualHours:0,snet:null,notes:""})},{noToast:true});
      note(`Added ${id} ${i.name}`);const p2=P();return taskRow(p2,calc(p2),p2.tasks.find(x=>x.id===id))}},
   {name:"add_risk",description:"Add a risk to the register. probability and impact are 1-5. Returns the risk.",inputSchema:{type:"object",properties:{title:{type:"string"},category:{type:"string",enum:RISKCAT},probability:{type:"number"},impact:{type:"number"},mitigation:{type:"string"},ownerId:{type:"string"}},required:["title","probability","impact"]},
    execute:(i)=>{const r={id:uid(),title:String(i.title),cat:RISKCAT.includes(i.category)?i.category:"technical",p:clamp(Math.round(+i.probability),1,5),i:clamp(Math.round(+i.impact),1,5),owner:i.ownerId||"",mitigation:String(i.mitigation||""),status:"open"};
      commit("Assistant added a risk",p=>p.risks.push(r),{noToast:true});note(`Added risk: ${r.title}`);return r}},
   {name:"list_risks",description:"Return the risk register.",execute:()=>{note("Read the risk register");return P().risks}},
   {name:"budget_detail",description:"Return budget lines, expenses and labour cost by person.",execute:()=>{const p=P(),c=calc(p);note("Read the budget");return{budget:p.budget,contingencyPct:p.contPct,lines:p.lines,laborPlanned:c.laborBAC,laborActual:c.actualLabor,expenses:p.expenses,BAC:c.BAC,AC:c.AC,EV:c.EV,PV:c.PV,CPI:+c.CPI.toFixed(3),SPI:+c.SPI.toFixed(3),EAC:Math.round(c.EAC)}}}
  ]};
}
async function sendChat(text){
  const ch=chatOf(),p=P();const log=$("#chatLog");
  $$(".sugg,.drawer .body>p").forEach(e=>e.remove());
  ch.view.push({r:"u",x:text});log.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(text)}</div>`);
  const bubble=document.createElement("div");bubble.className="msg a";bubble.textContent="Thinking…";log.append(bubble);
  const scroll=()=>{const b=$("#chatBody");if(b)b.scrollTop=b.scrollHeight};scroll();
  $("#chatIn").value="";$("#chatSend").disabled=true;const stop=$("#chatStop");stop.hidden=false;const ctl=new AbortController();stop.onclick=()=>ctl.abort();
  const RULES=`You are the project assistant inside Pathwise, a project-planning app. Help the project manager understand and update the plan. Be concise and concrete: use task IDs, dates and numbers. Use plain text, no markdown headings. ${S.cap.tools?"Use the tools to read details and to make changes the user asks for; every change is undoable, so act when the request is clear and confirm what you changed. Do not change anything the user did not ask for.":"You cannot change the plan in this view; explain what the user should change."}

${projectBrief(p)}`;
  ch.turns.push({role:"user",content:text});
  const turns=[{role:"user",content:RULES},{role:"assistant",content:"Understood. What would you like to know or change?"},...ch.turns.slice(-12)];
  const {tools}=assistantTools();
  try{
    const opts={signal:ctl.signal,cache:false,onText:({text})=>{bubble.textContent=text;scroll()}};
    if(S.cap.tools){opts.tools=tools;delete opts.cache}
    const {text:ans}=await S.cap.sample(turns,opts);
    bubble.textContent=ans;ch.turns.push({role:"assistant",content:ans});ch.view.push({r:"a",x:ans});
  }catch(e){
    const keep=e?.text||"";bubble.textContent=keep||({cancelled:"Stopped.",rate_limited:"Too many requests right now. Try again shortly.",not_granted:"Claude isn't allowed for this page."}[e?.code]||"That didn't go through. Try again.");
    if(keep)ch.turns.push({role:"assistant",content:keep});else ch.turns.pop();
    if(["not_granted","sampling_disabled","not_declared"].includes(e?.code))S.cap.sample=null;
  }finally{if($("#chatSend")){$("#chatSend").disabled=!S.cap.sample;stop.hidden=true}scroll();render()}
}

/* ================= Command palette ================= */
function openPalette(){
  const p=P();const items=[...VIEWS.map(([k,l])=>({l:`Go to ${l}`,g:"View",run:()=>go(k)})),
   {l:"Go to Home",g:"View",run:()=>go("home")},{l:"New project",g:"Action",run:()=>openNew()},{l:"Ask Claude about this project",g:"Action",run:openAssistant},{l:"Run Monte Carlo simulation",g:"Action",run:()=>{go("simulate");runMC()}},
   {l:"Add task",g:"Action",run:addTask},{l:"Save current schedule as baseline",g:"Action",run:()=>act("setBaseline")},{l:"Export tasks as CSV",g:"Action",run:()=>act("exportCSV")},{l:"Download all documents (ZIP)",g:"Download",run:()=>act("zipAll")},{l:"Download Gantt chart (PDF)",g:"Download",run:()=>act("ganttPDF")},{l:"Download Excel workbook",g:"Download",run:()=>act("exportXLSX")},{l:"Download current document as Word",g:"Download",run:()=>{go("docs");act("docWord")}},{l:"Back up project (.json)",g:"Action",run:()=>act("exportJSON")},{l:"Undo",g:"Action",run:undo},
   ...(p?p.tasks.map(t=>({l:`${t.id} ${t.name}`,g:STATUS[t.status],run:()=>openTask(t.id)})):[]),...S.projects.filter(x=>x.id!==S.cur).map(x=>({l:`Switch to ${x.name}`,g:"Project",run:()=>{S.cur=x.id;persist();render()}}))];
  S._palette={items,sel:0};
  layer(`<div class="scrim" data-close></div><div class="modal palette" role="dialog" aria-modal="true" aria-label="Command palette"><input type="text" id="palIn" placeholder="Jump to a view, task or action" autocomplete="off"><ul id="palList" role="listbox"></ul></div>`);
  const draw=()=>{const q=$("#palIn").value.toLowerCase();const f=items.filter(i=>i.l.toLowerCase().includes(q)).slice(0,40);S._palette.f=f;S._palette.sel=clamp(S._palette.sel,0,Math.max(0,f.length-1));
    $("#palList").innerHTML=f.map((i,k)=>`<li role="option" data-pi="${k}" class="${k===S._palette.sel?"on":""}">${esc(i.l)}<span class="g">${esc(i.g)}</span></li>`).join("")||`<li class="faint">No matches</li>`};
  draw();$("#palIn").addEventListener("input",()=>{S._palette.sel=0;draw()});
  $("#palIn").addEventListener("keydown",e=>{const pl=S._palette;if(e.key==="ArrowDown"){pl.sel++;draw();e.preventDefault()}else if(e.key==="ArrowUp"){pl.sel--;draw();e.preventDefault()}else if(e.key==="Enter"){const it=pl.f[pl.sel];if(it){closeLayer();it.run()}}});
  $("#palList").addEventListener("click",e=>{const li=e.target.closest("[data-pi]");if(!li)return;const it=S._palette.f[+li.dataset.pi];closeLayer();it.run()});
}

/* ================= actions ================= */
function go(v){S.view=v;render();window.scrollTo(0,0)}
function addTask(){const p=P();const id=nextTaskId(p);const ph=p.phases[0]?.id||"P1";if(!p.phases.length)p.phases.push({id:"P1",name:"Work"});
  commit(`Added ${id}`,p=>p.tasks.push({id,name:"New task",phase:ph,dur:3,deps:[],owner:p.team[0]?.id||"",effort:18,progress:0,status:"todo",actualHours:0,snet:todayIso(),notes:""}),{noToast:true});openTask(id)}
async function offerFile(filename,data,copyText){
  const blob=data instanceof Blob?data:new Blob([data]);
  const dl=S.cap.downloads;
  if(dl){try{await dl.save({filename,data:blob});toast("Saved "+filename);return}
    catch(e){const c=e?.code;if(c==="declined")return;
      if(c==="extension_not_enabled"||c==="rejected_extension"){toast("This file type can't be saved in this view.");return}
      if(c==="rate_limited"){toast("Another save is waiting for your answer. Try again in a moment.");return}
      if(!["unavailable","not_granted","capability_disabled","capability_removed"].includes(c)){toast("Couldn't save the file. Try again.");return}}}
  if(!window.claude){try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Downloaded "+filename);return}catch{}}
  const txt=copyText??(typeof data==="string"?data:null);
  if(txt){try{await navigator.clipboard.writeText(txt);toast("Saving files isn't available here, so it was copied to the clipboard.");return}catch{}}
  toast("Saving files isn't available in this view.");
}
function csvOf(p){const c=calc(p);const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const rows=[["ID","Task","Phase","Owner","Status","Progress","Start","Finish","Duration (wd)","Effort (h)","Actual (h)","Slack (wd)","Critical","Depends on"]];
  for(const t of p.tasks){const {s,f,r}=tDates(c,t);rows.push([t.id,t.name,p.phases.find(x=>x.id===t.phase)?.name,c.mem.get(t.owner)?.name,STATUS[t.status],t.progress||0,iso(s),iso(f),t.dur,t.effort,t.actualHours,r.slack,r.crit?"yes":"no",(t.deps||[]).map(d=>d.id).join(" ")])}
  return rows.map(r=>r.map(q).join(",")).join("\n")}
async function runMC(){const p=P();const b=$("[data-act=runMC]");if(b){b.disabled=true;b.textContent="Running…"}
  await new Promise(r=>setTimeout(r,30));const v=monteCarlo(p,S.ui.mcN,Date.now()%100000);S.ui.mcOut={k:stamp(p),v};render()}
async function act(a,el){
  const p=P();
  switch(a){
    case"new":return openNew();
    case"homeGo":{const i=$("#homeIdea"),v=(i?.value||"").trim();if(!v){toast("Describe your project first, or pick an example.");i?.focus();return}return openNew(v)}
    case"loadSample":{const s=makeSample();S.projects.push(s);S.cur=s.id;persist(s);return go("overview")}
    case"editProject":return openEditProject();
    case"addTask":return addTask();
    case"setBaseline":return commit("Saved the current schedule as baseline",setBaseline);
    case"exportCSV":return offerFile(`${slug(p.name)}_tasks.csv`,csvOf(p));
    case"exportJSON":return offerFile(`${slug(p.name)}.pathwise.json`,JSON.stringify(p,null,1));
    case"importJSON":return $("#importFile").click();
    case"addMember":return commit("Added a team member",p=>p.team.push({id:"m"+uid().slice(0,5),name:"New member",role:"Role",rate:50,capacity:32}));
    case"delMember":{const id=el.dataset.id;if(p.tasks.some(t=>t.owner===id&&t.status!=="done")){toast("Reassign this person's open tasks first.");return}return commit("Removed a team member",p=>p.team=p.team.filter(m=>m.id!==id))}
    case"reassign":{const t=p.tasks.find(x=>x.id===el.dataset.id),to=p.team.find(m=>m.id===el.dataset.to);return commit(`${t.id} moved to ${to.name}`,p=>p.tasks.find(x=>x.id===t.id).owner=to.id)}
    case"delExpense":return commit("Deleted an expense",p=>p.expenses=p.expenses.filter(e=>e.id!==el.dataset.id));
    case"addRisk":return commit("Added a risk",p=>p.risks.unshift({id:uid(),title:"New risk",cat:"technical",p:3,i:3,owner:p.team[0]?.id||"",mitigation:"",status:"open"}));
    case"delRisk":return commit("Deleted a risk",p=>p.risks=p.risks.filter(r=>r.id!==el.dataset.id));
    case"alertToRisk":{const kind=el.dataset.kind;const cat={schedule:"schedule",blocked:"schedule",dep:"schedule",deadline:"schedule",slip:"schedule",load:"people",budget:"budget",risk:"technical"}[kind]||"technical";
      return commit("Added a warning to the risk register",p=>p.risks.unshift({id:uid(),title:el.dataset.title,cat,p:4,i:3,owner:p.team[0]?.id||"",mitigation:"",status:"open"}))}
    case"clearCell":S.ui.riskCell=null;return render();
    case"runMC":return runMC();
    case"addChange":{const type=$("#chType").value;const d={delay:{task:p.tasks.find(t=>t.status!=="done")?.id,days:5},unavailable:{member:p.team[0]?.id,from:todayIso(),days:10},productivity:{member:"",pct:80},scope:{phase:"",pct:15},budget:{amount:5000},rate:{pct:5},target:{date:p.target}}[type];S.ui.scenario.push({type,...d});S.ui.scenarioOut=null;return render()}
    case"rmChange":S.ui.scenario.splice(+el.dataset.i,1);S.ui.scenarioOut=null;return render();
    case"runScenario":{const b=$("[data-act=runScenario]");b.disabled=true;b.textContent="Running…";await new Promise(r=>setTimeout(r,30));
      const sp=applyChanges(p,S.ui.scenario);const cs=calc(sp);const out={p:sp,c:{...cs},mcA:monteCarlo(p,800,5),mcB:monteCarlo(sp,800,5)};memo.clear();S.ui.scenarioOut=out;return render()}
    case"applyScenario":{const sp=S.ui.scenarioOut.p;const n=S.ui.scenario.length;commit(`Applied a what-if scenario (${n} change${n===1?"":"s"})`,p=>{for(const k of["tasks","team","budget","target"])p[k]=JSON.parse(JSON.stringify(sp[k]))});S.ui.scenario=[];return}
    case"discardScenario":S.ui.scenarioOut=null;return render();
    case"nlChange":return nlChange();
    case"docMD":return offerFile(`${docFileBase(p,S.ui.doc)}.md`,docFullMD(p,S.ui.doc));
    case"docHTML":return offerFile(`${docMeta(p,S.ui.doc).code}_${p.name.replace(/[^\w-]+/g,"_")}.html`,docFullHTML(p,S.ui.doc),docFullMD(p,S.ui.doc));
    case"docCopy":try{await navigator.clipboard.writeText(docFullMD(p,S.ui.doc));toast("Copied as Markdown")}catch{toast("Copy isn't available in this view.")}return;
    case"docWord":return makeFile("Preparing Word document",async()=>[`${docFileBase(p,S.ui.doc)}.docx`,await docxBytes(p,S.ui.doc)]);
    case"docPDF":return makeFile("Preparing PDF",async()=>[`${docFileBase(p,S.ui.doc)}.pdf`,new Blob([await docPDFBytes(p,S.ui.doc)],{type:"application/pdf"})]);
    case"ganttPDF":return makeFile("Preparing Gantt chart PDF",async()=>[`${slug(p.name)}_gantt.pdf`,new Blob([await ganttPDFBytes(p)],{type:"application/pdf"})]);
    case"exportXLSX":return makeFile("Preparing Excel workbook",async()=>[`${slug(p.name)}_workbook.xlsx`,await xlsxBytes(p)]);
    case"zipAll":return makeFile("Preparing all documents",async()=>[`${slug(p.name)}_documents.zip`,await zipAllBlob(p)]);
    case"docAI":return docAI();
    case"aiRisks":return aiRisks();
  }
}
async function nlChange(){
  const p=P(),inp=$("#nlChange"),txt=inp.value.trim();if(!txt)return;const b=$("[data-act=nlChange]");b.disabled=true;b.textContent="Reading…";
  const prompt=`Convert this what-if request about a project plan into a JSON array of change objects. Today is ${todayIso()}.
Request: "${txt}"
Team (id=name): ${p.team.map(m=>`${m.id}=${m.name} (${m.role})`).join("; ")}
Phases: ${p.phases.map(f=>`${f.id}=${f.name}`).join("; ")}
Open tasks: ${p.tasks.filter(t=>t.status!=="done").map(t=>`${t.id}=${t.name}`).join("; ")}
Allowed change objects:
{"type":"delay","task":"T12","days":5}
{"type":"unavailable","member":"m4","from":"YYYY-MM-DD","days":10}   (days = working days)
{"type":"productivity","member":"m2 or empty for everyone","pct":80}
{"type":"scope","phase":"P3 or empty for all","pct":15}   (pct change to remaining work)
{"type":"budget","amount":5000}
{"type":"rate","pct":5}
{"type":"target","date":"YYYY-MM-DD"}
Reply with only the JSON array.`;
  try{const arr=await S.cap.sample.json(prompt,{modelTier:"quick"});const ok=(Array.isArray(arr)?arr:[]).filter(x=>x&&CHANGE_TYPES[x.type]);
    if(!ok.length){toast("Couldn't turn that into changes. Try naming the person, task or phase.");}
    else{S.ui.scenario.push(...ok);S.ui.scenarioOut=null;render();toast(`Added ${ok.length} change${ok.length===1?"":"s"}`)}}
  catch(e){toast(e?.code==="rate_limited"?"Too many requests. Try again shortly.":"Couldn't read that request.");if(["not_granted","sampling_disabled"].includes(e?.code)){S.cap.sample=null;render()}}
  finally{const bb=$("[data-act=nlChange]");if(bb){bb.disabled=false;bb.textContent="Turn into changes"}}
}
